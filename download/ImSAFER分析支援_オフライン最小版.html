<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImSAFER 分析支援 v1.0（オフライン最小版）</title>
<style>
:root{--fs:14px;--bg:#eef1f5;--panel:#fff;--line:#d3d9e0;--text:#1f2937;--muted:#6b7280;--accent:#1976d2;--danger:#d32f2f;--warn:#f9a825;--ok:#2e7d32;--sticky:#fff8c5}
body.big{--fs:17px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Yu Gothic UI","Meiryo UI",Meiryo,"Hiragino Sans",system-ui,sans-serif;font-size:var(--fs);color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;color:var(--text)}
button:hover{background:#f3f6fa}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{background:#125ea8}
button.danger{color:var(--danger);border-color:#f3b4b4}
button.mini{padding:1px 6px;font-size:.8em;border-radius:4px}
button.icon{border:none;background:transparent;font-size:1.1em;padding:2px 6px}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #90caf9;outline-offset:0}
textarea{resize:vertical}
.full{width:100%}
header{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#1e293b;color:#fff;flex-wrap:wrap}
header h1{font-size:1.05em;margin:0 12px 0 0;font-weight:600}
header .file{font-size:.9em;opacity:.9;margin-right:auto}
header .file .dirty{color:#ffd54f;margin-left:6px}
header button{background:#334155;color:#fff;border-color:#475569}
header button:hover{background:#475569}
header button.active{background:#0ea5e9;border-color:#0ea5e9}
nav{display:flex;gap:4px;padding:6px 12px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{border-radius:20px;padding:5px 14px}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
nav .mode{margin-left:auto;align-self:center;color:var(--muted);font-size:.9em}
#main{flex:1;min-height:0;display:flex;overflow:hidden}
.toolbar{display:flex;gap:6px;align-items:center;padding:6px 10px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar .hint{color:var(--muted);font-size:.88em;margin-left:auto}
.toolbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.view{flex:1;min-width:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow:auto;padding:12px}
aside.side{width:300px;flex:none;background:#fff;border-left:1px solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:12px}
aside.side h3{margin:0 0 6px;font-size:.95em;color:#334155;border-bottom:2px solid #e2e8f0;padding-bottom:4px}
.rules{background:#fff7e6;border:1px solid #ffe0a3;border-radius:8px;padding:8px 10px;font-size:.88em}
.rules li{margin:3px 0}
.note{color:var(--muted);font-size:.88em}
/* basic form */
.form-wrap{max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 24px}
.form-wrap h2{margin:0 0 12px;font-size:1.15em}
.field{display:grid;grid-template-columns:170px 1fr;gap:8px;align-items:center;margin:8px 0}
.field label{color:#334155}
.warnbox{background:#fdecea;border:1px solid #f5c2c0;color:#8a1c1c;border-radius:8px;padding:8px 10px;margin:12px 0;font-size:.92em}
.okbox{background:#e8f5e9;border:1px solid #bfe3c2;color:#1b5e20;border-radius:8px;padding:8px 10px;font-size:.92em}
/* timeline */
.tl-zoom{display:inline-block}
table.tl{border-collapse:separate;border-spacing:0;table-layout:fixed;background:#fff}
table.tl th,table.tl td{border:1px solid var(--line);vertical-align:top;padding:0}
table.tl th{background:#f1f5f9;position:sticky;top:0;z-index:2;padding:6px 6px;text-align:left;font-weight:600}
table.tl th.timecol,table.tl td.timecol{position:sticky;left:0;z-index:1;background:#f8fafc}
table.tl th.timecol{z-index:3}
table.tl th .pname{display:flex;align-items:center;gap:4px}
table.tl th .pname span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.tl th .ptools{display:none;gap:2px}
table.tl th:hover .ptools{display:flex}
table.tl th .rs{position:absolute;right:-3px;top:0;bottom:0;width:6px;cursor:col-resize}
table.tl th{position:sticky}
table.tl td.cell{min-height:44px;cursor:cell}
table.tl td.cell .cell-inner{min-height:44px;padding:5px;display:flex;flex-direction:column;gap:5px}
table.tl td.cell.over{background:#e3f2fd}
table.tl td.timecol .time{width:100%;padding:3px 6px;border:1px solid transparent;background:transparent}
table.tl td.timecol .time:hover,table.tl td.timecol .time:focus{border-color:var(--line);background:#fff}
table.tl td.timecol .rtools{display:flex;gap:2px;padding:0 4px 4px;opacity:.25}
table.tl td.timecol:hover .rtools{opacity:1}
table.tl td.addrow{background:#fff;padding:6px}
.card{position:relative;background:var(--sticky);border:1px solid #e0c96b;border-left:4px solid #e0c96b;border-radius:5px;padding:4px 6px 3px;box-shadow:1px 1px 2px rgba(0,0,0,.08);cursor:grab}
.card.dragging{opacity:.4}
.card.prob{border-color:#e57373;border-left-color:#d32f2f}
.card.final{outline:3px solid #d32f2f;outline-offset:-1px}
.card.cert-推測{border-style:dashed}
.card.cert-不明{border-style:dotted;background:#f1f5f9}
.card.src-報告書{background:#fff3cd}
.card .marks{min-height:14px;display:flex;gap:4px;font-weight:700;font-size:.9em}
.card .marks .x{color:var(--danger)}
.card .marks .star{color:#c62828}
.card .marks .whint{color:#b45309;background:#fff3cd;border-radius:8px;padding:0 5px;font-size:.8em;cursor:help;margin-left:auto}
.card .ctools{position:absolute;right:3px;top:2px;display:none;gap:2px}
.card:hover .ctools{display:flex}
.card .ctext{white-space:pre-wrap;word-break:break-all;cursor:text;min-height:1.4em;line-height:1.4}
.card .ctext.empty{color:#9ca3af}
.card textarea.card-edit{width:100%;border:1px solid var(--accent);border-radius:4px;padding:3px 5px;resize:none;line-height:1.4;font-size:1em}
.card .ctags{display:flex;gap:4px;margin-top:2px}
.card .ctags button{font-size:.72em;padding:0 5px;border-radius:9px;color:var(--muted);background:#fff}
.card .ctags button.on{color:#fff;background:#6b7280;border-color:#6b7280}
.card .ctags button.on.src{background:#b8860b;border-color:#b8860b}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;display:flex;gap:6px;align-items:flex-start}
.plist li.final{border-color:#d32f2f;background:#fff5f5}
.plist li.used{opacity:.55}
.plist li .no{color:var(--danger);font-weight:700;white-space:nowrap}
.plist li .body{flex:1;min-width:0}
.plist li .meta{color:var(--muted);font-size:.8em}
.plist li[draggable=true]{cursor:grab}
/* tree */
.tree-area{flex:1;position:relative;overflow:hidden;background:#fafbfc;background-image:radial-gradient(#dfe5ec 1px,transparent 1px);background-size:20px 20px}
.tree-area svg{width:100%;height:100%;display:block;user-select:none}
.tree-area svg g.node{cursor:pointer}
.tree-area svg g.node.drop rect{stroke:#ff9800!important;stroke-width:4!important}
#treeOverlay{position:absolute;inset:0;pointer-events:none}
#treeOverlay>*{pointer-events:auto}
.ntool{position:absolute;display:flex;gap:4px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px;box-shadow:0 2px 8px rgba(0,0,0,.15);max-width:520px;font-size:.9em}
.ntool select{padding:2px 4px}
.ntool label{display:flex;align-items:center;gap:3px;white-space:nowrap}
#nodeEdit{position:absolute;border:2px solid var(--accent);border-radius:6px;padding:4px 6px;resize:none;line-height:1.5;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border-radius:12px;padding:2px 9px;font-size:.85em;color:#fff;font-weight:600}
.chip.unused{background:#fff!important;color:#9ca3af;border:1px dashed #cbd5e1;font-weight:400}
.banner{background:#fff3cd;border-bottom:1px solid #ffe08a;padding:6px 10px;display:flex;gap:10px;align-items:center}
.empty{margin:auto;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
/* modal */
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:12px;min-width:360px;max-width:min(92vw,720px);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:1.05em}
.modal-body{padding:14px 16px;overflow:auto}
.modal-body p{margin:6px 0}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line)}
.start-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.start-grid.g3{grid-template-columns:1fr 1fr 1fr}
.start-grid button{padding:14px;font-size:1.05em}
.recent{list-style:none;padding:0;margin:8px 0 0}
.recent li{padding:6px 8px;border:1px solid var(--line);border-radius:6px;margin:4px 0;cursor:pointer}
.recent li:hover{background:#f3f6fa}
kbd{background:#f1f5f9;border:1px solid #cbd5e1;border-radius:4px;padding:0 5px;font-family:inherit;font-size:.9em}
/* output */
.out-form{max-width:640px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 24px}
.out-form .row{display:flex;gap:14px;align-items:center;margin:10px 0;flex-wrap:wrap}
.out-form fieldset{border:1px solid var(--line);border-radius:8px;margin:10px 0}
/* steps 4-7 */
.fg{background:#fff;border:1px solid var(--line);border-radius:8px;margin:0 0 10px;overflow:hidden}
.fg-head{display:flex;gap:8px;align-items:center;padding:8px 10px;background:#f8fafc;border-bottom:1px solid var(--line)}
.fg-head .fg-text{flex:1;font-weight:600}
.badge{font-size:.78em;border-radius:10px;padding:1px 8px;white-space:nowrap}
.badge.ok{background:#e8f5e9;color:#1b5e20}
.badge.warn{background:#fff3cd;color:#7a5200}
.mrow{display:grid;grid-template-columns:1fr 210px 150px 34px;gap:8px;align-items:start;padding:6px 10px;border-top:1px dashed #e5e7eb}
.mrow .steplab{font-size:.85em;color:var(--muted);padding-top:6px}
.mrow .mhint{grid-column:1/-1;font-size:.82em;color:#7a5200;background:#fff8e1;border-radius:6px;padding:3px 8px}
table.dt{border-collapse:collapse;background:#fff;width:100%;font-size:.95em}
table.dt th,table.dt td{border:1px solid var(--line);padding:4px 6px;vertical-align:top}
table.dt th{background:#f1f5f9;font-weight:600;white-space:nowrap;position:sticky;top:0}
table.dt td input,table.dt td select,table.dt td textarea{width:100%;padding:3px 6px}
table.dt td.ro{background:#fafafa}
table.dt tr.dec-採用 td:first-child{border-left:4px solid #2e7d32}
table.dt tr.dec-不採用 td{color:#9ca3af}
.guide-tbl{width:100%;border-collapse:collapse;font-size:.82em}
.guide-tbl td{padding:3px 4px;border-bottom:1px solid #eef2f7;vertical-align:top}
.guide-tbl td.no{font-weight:700;color:var(--accent);white-space:nowrap}
.dist{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;font-size:.85em}
.dist div{background:#f1f5f9;border-radius:6px;padding:4px}
.dist b{display:block;font-size:1.3em}
/* quick */
.qsec{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:0 auto 14px;max-width:1100px}
.qsec h2{margin:0 0 10px;font-size:1.05em;display:flex;align-items:center;gap:10px}
.qsec h2 .qn{background:var(--accent);color:#fff;border-radius:14px;padding:1px 10px;font-size:.85em}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 16px}
.qgrid label{display:flex;flex-direction:column;gap:3px;font-size:.9em;color:#334155}
.pe{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pe h4{margin:0 0 6px}
.pe-item{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px;align-items:center;margin:4px 0}
.pe-item input.t{width:74px}
.pe-item .unseen{font-size:.8em;white-space:nowrap}
.qtree{display:grid;grid-template-columns:1fr 280px;gap:10px}
.qtree .tree-area{height:440px;border:1px solid var(--line);border-radius:8px}
.qtree aside{border:1px solid var(--line);border-radius:8px;padding:8px;overflow:auto;max-height:440px;display:flex;flex-direction:column;gap:10px}
.evrow{display:grid;grid-template-columns:90px 160px 1fr auto;gap:6px;align-items:center;margin:4px 0}
/* list editor */
table.lt{border-collapse:collapse;background:#fff;font-size:.95em}
table.lt th,table.lt td{border:1px solid var(--line);padding:3px 5px;vertical-align:top}
table.lt th{background:#f1f5f9;position:sticky;top:0;z-index:1;white-space:nowrap;font-weight:600}
table.lt td.no{text-align:center;color:var(--muted);background:#fafafa;white-space:nowrap}
table.lt td input,table.lt td select,table.lt td textarea{padding:3px 6px}
table.lt td textarea{width:100%;min-height:30px;resize:none;line-height:1.4}
table.lt td .tcell{display:flex;gap:3px;align-items:center}
table.lt td .tcell input{width:110px}
table.lt td .ops{display:flex;gap:2px;white-space:nowrap}
table.lt tr.shared td.tm{background:#f8fafc}
table.lt button.tog{min-width:30px}
table.lt button.tog.on{background:#fde2e2;border-color:#e57373;color:#c62828;font-weight:700}
table.lt button.tog.star.on{background:#fff3cd;border-color:#f2b705;color:#8a5a00}
table.lt button.tog.chk.on{background:#e8f5e9;border-color:#81c784;color:#1b5e20}
/* confirm mode */
body.confirm .card.src-報告書:not(.checked),body.confirm .card.src-ヒアリング:not(.checked){outline:2px dashed #f2b705;outline-offset:-1px}
body.confirm .card.checked{border-left-color:#2e7d32}
body.confirm .card .cchk{display:inline-flex!important}
.card .cchk{display:none;position:absolute;right:3px;bottom:3px;gap:2px}
.card .marks .ok{color:#2e7d32;font-weight:700}
.card .marks .flag{color:#fff;background:#e65100;border-radius:8px;padding:0 6px;font-size:.78em;font-weight:600}
.card.cur{box-shadow:0 0 0 3px #1976d2}
.cprog{background:#e8f5e9;border:1px solid #bfe3c2;border-radius:8px;padding:8px 10px}
.cprog .bar{height:8px;background:#fff;border-radius:4px;overflow:hidden;margin-top:6px;border:1px solid #cde}
.cprog .bar div{height:100%;background:#43a047}
.clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:40vh;overflow:auto}
.clist li{border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:.9em}
.clist li:hover{background:#f3f6fa}
.clist li.cur{border-color:#1976d2;background:#e3f2fd}
.clist li .m{color:var(--muted);font-size:.85em}
/* print */
#printRoot{display:none}
@media print{
  body>*:not(#printRoot){display:none!important}
  body{display:block;height:auto;overflow:visible;background:#fff}
  #printRoot{display:block}
  .page{page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto;break-after:auto}
  .page-report{page:report}
  .page-diagram{page:diagram}
  .ptitle{font-size:10pt;color:#333;margin:0 0 2mm}
  .rep h1{font-size:15pt;margin:0 0 4mm}
  .rep h2{font-size:12pt;margin:5mm 0 2mm;border-left:4px solid #1976d2;padding-left:2mm}
  .rep table{border-collapse:collapse;width:100%;font-size:9.5pt}
  .rep th,.rep td{border:1px solid #888;padding:1.2mm 2mm;text-align:left;vertical-align:top}
  .rep th{background:#eee}
}
</style>
<style id="printStyle"></style>
</head>
<body>
<header>
  <h1>ImSAFER 分析支援 <small style="font-weight:400;opacity:.8">v1.0 オフライン最小版</small></h1>
  <span class="file"><span id="fileName">新しい事例</span><span id="dirty" class="dirty" hidden>● 未保存</span></span>
  <button id="btnNew">新規</button>
  <button id="btnOpen">開く</button>
  <button id="btnSave" title="Ctrl+S">保存</button>
  <button id="btnSaveAs">名前を付けて保存</button>
  <button id="btnUndo" title="Ctrl+Z">↶ 元に戻す</button>
  <button id="btnRedo" title="Ctrl+Y">↷ やり直す</button>
  <button id="btnBig" title="プロジェクター向けに文字を大きくします">大きな文字</button>
  <button id="btnHelp">使い方</button>
</header>
<nav id="nav"></nav>
<div id="main"></div>
<div id="printRoot"></div>
<script>
'use strict';
/* ========== utils ========== */
const APP_ID='ImSAFER分析アプリ';
const DRAFT_KEY='imsafer.draft.v1';

const SVGNS='http://www.w3.org/2000/svg';

function btn(label,onClick,props={}){const b=h('button',{type:'button',...props},label);b.addEventListener('mousedown',e=>e.preventDefault());b.addEventListener('click',e=>{flushEdits();onClick(e);});return b;}
function markDirty(){ui.dirty=true;S.updatedAt=new Date().toISOString();scheduleDraft();const d=$('#dirty');if(d)d.hidden=false;}
function flushField(){if(ui.fieldSnap){if(ui.fieldSnap!==snapshot())pushHistory(ui.fieldSnap);ui.fieldSnap=null;}}
function bindText(el,setter,onCommit){el.addEventListener('focus',()=>{if(!ui.fieldSnap)ui.fieldSnap=snapshot();});el.addEventListener('input',()=>{setter(el.value);markDirty();});el.addEventListener('change',()=>{flushField();renderShell();onCommit&&onCommit(el.value);});return el;}
function txt(get,set,props={},onCommit){const el=h('input',{type:'text',class:'full',value:get()||'',...props});return bindText(el,set,onCommit);}
function ta(get,set,props={},onCommit){const el=h('textarea',{class:'full',rows:1,value:get()||'',...props});bindText(el,set,onCommit);el.addEventListener('input',autoGrow);el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();el.blur();}});requestAnimationFrame(()=>autoGrow({target:el}));return el;}
function sel(get,set,options,props={}){const el=h('select',{...props},...options.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o||'－'];return h('option',{value:v},l);}));el.value=get()??'';el.addEventListener('change',()=>mutate(()=>set(el.value)));return el;}
const FONT_FAMILY='"Yu Gothic UI","Meiryo UI",Meiryo,"Hiragino Sans",sans-serif';
const _mc=document.createElement('canvas').getContext('2d');
function wrapText(text,maxW,font){_mc.font=font;const lines=[];for(const para of String(text??'').split('\n')){let line='';for(const ch of para){const t=line+ch;if(_mc.measureText(t).width>maxW&&line){lines.push(line);line=ch;}else line=t;}lines.push(line);}return lines.length?lines:[''];}
function b64(u8){let s='';for(const b of u8)s+=b.toString(16).padStart(2,'0');return s;}
function unb64(s){if(!/^[0-9a-f]*$/i.test(s)||s.length%2)throw new Error('このパスワード付きファイルは、通常版（Web版・フル版）で開いてください。');const u8=new Uint8Array(s.length/2);for(let i=0;i<u8.length;i++)u8[i]=parseInt(s.substr(i*2,2),16);return u8;}
function fmtDate(iso){if(!iso)return'';const d=new Date(iso);return isNaN(d)?iso:`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}

function openModal({title,body,buttons=[],width,closable=true,onClose}){
  const back=h('div',{class:'modal-back'});

  const bodyEl=h('div',{class:'modal-body'});
  if(typeof body==='string')bodyEl.innerHTML=body;else bodyEl.append(body);
  box.append(bodyEl);
  if(buttons.length)box.append(h('div',{class:'modal-foot'},...buttons.map(b=>h('button',{class:b.primary?'primary':(b.danger?'danger':''),onclick:async()=>{const r=b.onClick?await b.onClick(bodyEl,close):undefined;if(r!==false)close();}},b.label))));

}

async function deriveKey(pw,salt,iter){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encryptText(pw,text){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=200000;const key=await deriveKey(pw,salt,iter);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text));return{salt:b64(salt),iv:b64(iv),iter,data:b64(new Uint8Array(ct))};}
async function decryptText(pw,obj){const key=await deriveKey(pw,unb64(obj.salt),obj.iter||200000);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(obj.iv)},key,unb64(obj.data));return new TextDecoder().decode(pt);}
const cryptoOK=()=>!!(window.crypto&&crypto.subtle);
function serialize(){return JSON.stringify({app:APP_ID,format:1,savedAt:new Date().toISOString(),case:S});}
async function buildFileText(){const plain=serialize();if(!ui.password)return plain;const enc=await encryptText(ui.password,plain);return JSON.stringify({app:APP_ID,format:1,encrypted:true,...enc});}
async function parseFileText(text){let obj;try{obj=JSON.parse(text);}catch{throw new Error('ファイルの形式が正しくありません。');}if(obj.app!==APP_ID)throw new Error('このアプリで作成したファイルではありません。');
  if(obj.encrypted){if(!cryptoOK())throw new Error('この環境ではパスワード付きファイルを開けません。');const pw=await promptPassword('このファイルはパスワードで保護されています。');if(pw==null)return null;try{const plain=await decryptText(pw,obj);return{case:migrate(JSON.parse(plain).case),password:pw};}catch{throw new Error('パスワードが違うか、ファイルが壊れています。');}}
  return{case:migrate(obj.case),password:null};}

const FILE_TYPES=[{description:'ImSAFER分析ファイル',accept:{'application/json':['.json']}}];
async function saveFile(saveAs=false){
  flushEdits();
  const text=await buildFileText();const name=ui.fileName||suggestedName();
  if('showSaveFilePicker' in window){
    try{
      if(saveAs||!ui.fileHandle){ui.fileHandle=await showSaveFilePicker({suggestedName:name,types:FILE_TYPES});}
      const w=await ui.fileHandle.createWritable();await w.write(text);await w.close();
      ui.fileName=ui.fileHandle.name;markSaved();addRecent(ui.fileHandle);return true;
    }catch(e){if(e&&e.name==='AbortError')return false;console.warn('FSA save failed, fallback to download',e);ui.fileHandle=null;}
  }
  alertDlg('このブラウザでは保存できません。Microsoft Edge で開いてお使いください。\n（オフライン版は、安全のためダウンロード機能を持たせていません）','保存できません');
  return false;
}

let draftTimer=null;
function scheduleDraft(){clearTimeout(draftTimer);draftTimer=setTimeout(saveDraft,2000);}
async function saveDraft(){try{const plain=serialize();let payload=plain,encrypted=false;if(ui.password&&cryptoOK()){payload=JSON.stringify(await encryptText(ui.password,plain));encrypted=true;}localStorage.setItem(DRAFT_KEY,JSON.stringify({savedAt:new Date().toISOString(),fileName:ui.fileName,caseNo:S.caseNo,encrypted,payload}));}catch(e){console.warn('draft',e);}}
function clearDraft(){clearTimeout(draftTimer);try{localStorage.removeItem(DRAFT_KEY);}catch{}}

async function restoreDraft(){const d=readDraft();if(!d)return;let plain=d.payload,pw=null;if(d.encrypted){pw=await promptPassword('下書きはパスワードで保護されています。');if(pw==null)return;try{plain=await decryptText(pw,JSON.parse(d.payload));}catch{alertDlg('パスワードが違います。');return;}}try{const obj=JSON.parse(plain);loadCase(migrate(obj.case),{name:d.fileName,password:pw});ui.dirty=true;scheduleDraft();renderShell();}catch(e){alertDlg('下書きを復元できませんでした。');}}
/* recent (IndexedDB) */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('imsafer-app',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function kvGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}catch{return null;}}
async function kvSet(k,v){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('kv','readwrite').objectStore('kv').put(v,k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error);});}catch(e){console.warn(e);}}
async function addRecent(handle){if(!handle)return;try{const list=(await kvGet('recent'))||[];const out=[];for(const r of list){let same=false;try{same=await r.handle.isSameEntry(handle);}catch{}if(!same)out.push(r);}out.unshift({name:handle.name,handle,at:Date.now()});await kvSet('recent',out.slice(0,8));}catch(e){console.warn(e);}}
async function openRecent(r){try{if(ui.dirty&&!(await confirmDlg('未保存の変更があります。破棄して開きますか？',{okLabel:'破棄して開く',danger:true})))return;const p=await r.handle.requestPermission({mode:'readwrite'});if(p!=='granted')return;const f=await r.handle.getFile();const res=await parseFileText(await f.text());if(!res)return;loadCase(res.case,{handle:r.handle,name:f.name,password:res.password});}catch(e){alertDlg('ファイルを開けませんでした：'+e.message);}}

/* ========== CSV 書き出し ========== */
function rowTime(e){return S.rows.find(r=>r.id===e.rowId)?.time||'';}
function csvCell(v){const t=String(v??'').replace(/\r\n|\r/g,'\n');return '"'+t.replace(/"/g,'""')+'"';}
function csvRows(rows){return rows.map(r=>r.map(csvCell).join(',')).join('\r\n');}
function buildCsv(){
  const isQ=S.mode==='QuickSAFER';const out=[];
  const sec=(title,rows)=>{out.push(csvCell('■ '+title));out.push(csvRows(rows));out.push('');};
  sec('基本情報',[['項目','内容'],['事例No',S.caseNo],['発生日',S.occurredDate],['分析日',S.analysisDate],
    ['部署',S.department],['事象レベル',levelText()],['事象の種類',S.category],['分析手法',S.mode],
    [isQ?'分析者（職種）':'分析メンバー（職種）',S.members],['概要',S.summary],['出力日時',fmtDate(new Date().toISOString())]]);
  const tl=[['時刻','登場人物','出来事・行動','確度','出所','問題点','最終事象','確認済み','要修正']];
  for(const r of S.rows)for(const e of S.events.filter(x=>x.rowId===r.id))
    tl.push([r.time,personLabel(byPerson(e.personId)),e.text,e.certainty,e.source,
      e.problemNo?`×(${e.problemNo})`:'',e.isFinal?'★':'',e.checked?'✓':'',e.flag||'']);
  sec(isQ?'出来事の流れ':'時系列事象関連図',tl);
  if(isQ){
    const q=S.quick||{};
    sec('分析対象行為',[['分析対象者',q.actor?personLabel(byPerson(q.actor)):''],['分析対象行為',q.action||'']]);
    sec('P-E情報整理表',[['区分','時刻／分類','内容','認識せず'],
      ...(q.pe||[]).map(it=>[it.side==='E'?'E 環境':'P 人間',it.side==='E'?it.time:it.cat,it.text,it.unseen?'○':''])]);
  }else{
    sec('問題点一覧',[['番号','時刻','登場人物','内容','最終事象'],
      ...problems().map(e=>[`×(${e.problemNo})`,rowTime(e),personLabel(byPerson(e.personId)),e.text,e.isFinal?'★':''])]);
  }
  const facs=analysisFactors();
  sec('背後要因一覧',[['階層','P-mSHELL','背後要因','種別','院内で対策できる','備考'],
    ...facs.map(f=>[String(depthOf(f)),pmName(f.pmshell),'　'.repeat(depthOf(f))+f.text,typeName(f.type),
      f.actionable?'○':'',f.otherActor?'別の当事者の行動':''])]);
  sec('対策一覧',[['対策案','対象要因','GUIDE','4STEP/M','効果','実現性','コスト','副作用','採否','備考'],
    ...measureOrder().map(m=>[m.text,m.factorId?factorLabel(m.factorId):'',guideShort(m.guide),stepLabel(m.guide),
      m.eval.effect,m.eval.feas,m.eval.cost,m.eval.side,m.decision,m.note])]);
  sec('実施計画・評価',[['対策','担当','期限','方法・手順','実施確認日','状況','評価日','定着度','効果','新たな問題','次の対応'],
    ...adoptedMeasures().map(m=>[m.text,m.owner,m.due,m.method,m.done,m.status,m.reviewDate,m.fixation,m.effectResult,m.newIssues,m.next])]);
  return '\ufeff'+out.join('\r\n');
}
async function exportCsv(){
  flushEdits();
  const text=buildCsv();
  const name=`ImSAFER_${(S.caseNo||'事例').replace(/[\\/:*?"<>|]/g,'_')}_${(S.analysisDate||'').replace(/-/g,'')||'draft'}.csv`;
  if(!('showSaveFilePicker' in window)){
    alertDlg('このブラウザでは保存できません。Microsoft Edge で開いてお使いください。','保存できません');return;
  }
  try{
    const hnd=await showSaveFilePicker({suggestedName:name,types:[{description:'CSV（Excel で開けます）',accept:{'text/csv':['.csv']}}]});
    const w=await hnd.createWritable();await w.write(text);await w.close();
    alertDlg('CSV を保存しました。Excel で開くと表として編集できます。');
  }catch(e){if(e&&e.name==='AbortError')return;alertDlg('保存できませんでした：'+e.message);}
}

  body.append(h('div',{class:'start-grid'},h('button',{class:'primary',onclick:()=>{m.close();loadCase(newCase('ImSAFER'));}},'新規作成（ImSAFER）'),h('button',{onclick:()=>{m.close();loadCase(newCase('QuickSAFER'));}},'新規作成（QuickSAFER）'),h('button',{onclick:()=>{m.close();openFile();}},'ファイルを開く'),d?h('button',{onclick:()=>{m.close();restoreDraft();}},`下書きを復元\n（${fmtDate(d.savedAt)}${d.caseNo?' / '+d.caseNo:''}）`):h('button',{disabled:true},'下書きなし')));

/* ========== init ========== */
document.addEventListener('keydown',e=>{
  const t=e.target;const inField=/INPUT|TEXTAREA|SELECT/.test(t.tagName)||t.isContentEditable;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveFile(false);return;}
  if((e.ctrlKey||e.metaKey)&&!inField&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return;}
  if((e.ctrlKey||e.metaKey)&&!inField&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}
  if((ui.step==='s3'||ui.step==='quick')&&!inField&&ui.selectedNode&&!ui.editingNode&&!$('.modal-back')){
    if(e.key==='Enter'&&e.shiftKey){e.preventDefault();addSibling(ui.selectedNode);}
    else if(e.key==='Enter'){e.preventDefault();addFactor(ui.selectedNode);}
    else if(e.key==='F2'){e.preventDefault();startNodeEdit(ui.selectedNode);}
    else if(e.key==='Delete'){e.preventDefault();deleteNode(ui.selectedNode);}
    else if(e.key==='Escape'){ui.selectedNode=null;redrawTree();}
  }
});
window.addEventListener('beforeunload',e=>{if(ui.dirty){e.preventDefault();e.returnValue='';}});
$('#btnNew').addEventListener('click',newCaseFlow);
$('#btnOpen').addEventListener('click',openFile);
$('#btnSave').addEventListener('click',()=>saveFile(false));
$('#btnSaveAs').addEventListener('click',()=>saveFile(true));
$('#btnUndo').addEventListener('click',undo);
$('#btnRedo').addEventListener('click',redo);
$('#btnBig').addEventListener('click',()=>{flushEdits();document.body.classList.toggle('big');render();});
$('#btnHelp').addEventListener('click',showHelp);
for(const id of ['btnNew','btnOpen','btnSave','btnSaveAs','btnUndo','btnRedo','btnBig','btnHelp'])$('#'+id).addEventListener('mousedown',e=>e.preventDefault());
S=newCase();render();showStart();
