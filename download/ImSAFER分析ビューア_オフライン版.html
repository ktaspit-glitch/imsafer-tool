<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>ImSAFER 分析ビューア（オフライン版）</title>
<style>
:root{--fs:15px;--bg:#eef1f5;--panel:#fff;--line:#d3d9e0;--text:#1f2937;--muted:#6b7280;--accent:#1976d2;--danger:#d32f2f;--sticky:#fff8c5}
body.big{--fs:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:"Yu Gothic UI","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:var(--fs);color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;color:var(--text)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
header{background:#1e293b;color:#fff;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header h1{font-size:1em;margin:0;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header button{background:#334155;color:#fff;border-color:#475569;padding:5px 9px;font-size:.88em}
header button.on{background:#0ea5e9;border-color:#0ea5e9}
nav{display:flex;gap:6px;padding:7px 10px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
nav button{border-radius:20px;white-space:nowrap;padding:6px 14px;font-size:.92em}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
main{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 10px max(16px,env(safe-area-inset-bottom))}
.wrap{max-width:900px;margin:0 auto}
h2.sec{font-size:1.05em;margin:14px 0 8px;padding-left:8px;border-left:4px solid var(--accent)}
h2.sec:first-child{margin-top:0}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px}
.note{color:var(--muted);font-size:.85em}
.kv{display:grid;grid-template-columns:5.6em 1fr;gap:3px 8px;font-size:.95em}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.chip{display:inline-block;border-radius:11px;padding:1px 9px;font-size:.78em;background:#eef2f7;color:#334155;white-space:nowrap}
.chip.pm{color:#fff}
.chip.ok{background:#e8f5e9;color:#1b5e20}
.chip.warn{background:#fff3cd;color:#7a5200}
.chip.red{background:#fde2e2;color:#b71c1c}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.banner{background:#fff8e1;border:1px solid #ffe0a3;border-radius:10px;padding:9px 12px;margin:0 0 10px;font-size:.9em}
.toolrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.toolrow .sp{flex:1}
/* timeline list */
.tgroup{margin:0 0 12px}
.thead{display:inline-block;background:#334155;color:#fff;border-radius:12px;padding:2px 12px;font-size:.85em;font-weight:600;margin:0 0 6px}
.ev{background:var(--sticky);border:1px solid #e0c96b;border-left:5px solid #e0c96b;border-radius:8px;padding:8px 10px;margin:0 0 6px}
.ev.prob{border-color:#e57373;border-left-color:var(--danger)}
.ev.final{box-shadow:0 0 0 2px var(--danger) inset}
.ev.guess{border-style:dashed}
.ev .who{font-size:.82em;color:#5b4b00;font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ev .who .mk{color:var(--danger);font-weight:700}
.ev .tx{margin-top:3px;line-height:1.5;white-space:pre-wrap}
/* tree outline */
.tr{border-left:3px solid #cbd5e1;margin-left:10px;padding-left:12px}
.tr>.node{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin:6px 0}
.node.root{background:#fde2e2;border-color:var(--danger)}
.node.action,.node.judge{border-color:var(--accent);background:#f5faff}
.node.cushion{background:var(--sticky);border-color:#f2b705}
.node .lab{font-size:.76em;color:var(--muted)}
.node .tx{line-height:1.5}
/* svg box */
.svgbox{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;-webkit-overflow-scrolling:touch;max-height:72vh}
.svgbox svg{display:block}
/* measures */
.m .gd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.m .no{background:var(--accent);color:#fff;border-radius:50%;width:1.7em;height:1.7em;display:inline-flex;align-items:center;justify-content:center;font-size:.8em;font-weight:700;flex:none}
.m.adopt{border-left:5px solid #2e7d32}
.m.reject{opacity:.55}
table.ev2{width:100%;border-collapse:collapse;font-size:.9em}
table.ev2 th,table.ev2 td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
table.ev2 th{background:#f1f5f9;white-space:nowrap}
.pe{display:grid;gap:8px}
@media(min-width:700px){.pe{grid-template-columns:1fr 1fr}}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.about li{margin:5px 0;line-height:1.6}
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:14px;width:100%;max-width:420px;max-height:84vh;overflow:auto;padding:16px}
.modal h3{margin:0 0 10px;font-size:1.05em}
.modal button{width:100%;margin:6px 0;text-align:left;padding:12px}
</style>
</head>

</header>

    svg.append(g);}

}
function buildTimelineSVG(){
  const fs=12,font=`${fs}px ${FONT_FAMILY}`,LH=Math.round(fs*1.45);
  const timeW=84,headH=32,cellPad=6,cardPad=6,cardGap=6;
  const cols=S.persons.map(p=>({p,w:p.width||180}));
  const rows=S.rows.map(r=>{let maxH=34;const cells={};for(const c of cols){const items=S.events.filter(e=>e.rowId===r.id&&e.personId===c.p.id).map(e=>{const lines=wrapText(e.text||'',c.w-2*cellPad-2*cardPad-4,font);const marks=[e.problemNo?`×(${e.problemNo})`:null,e.isFinal?'★':null,e.checked?'✓':null,e.flag||null].filter(Boolean).join(' ');const foot=[e.certainty!=='事実'?e.certainty:null,e.source!=='会議'?e.source:null].filter(Boolean).join('・');return{e,lines,marks,foot,hh:cardPad*2+(marks?15:0)+lines.length*LH+(foot?13:0)};});const hsum=items.reduce((a,i)=>a+i.hh,0)+(items.length?(items.length-1)*cardGap:0);cells[c.p.id]=items;maxH=Math.max(maxH,hsum+2*cellPad);}return{r,cells,h:maxH};});
  const W=timeW+cols.reduce((a,c)=>a+c.w,0),H=headH+rows.reduce((a,r)=>a+r.h,0);
  const svg=svgEl('svg',{xmlns:SVGNS,viewBox:`0 0 ${W} ${H}`,'font-family':FONT_FAMILY});
  svg.append(svgEl('rect',{width:W,height:H,fill:'#fff'}),svgEl('rect',{width:W,height:headH,fill:'#f1f5f9'}));
  svg.append(svgEl('text',{x:timeW/2,y:headH/2+4,'font-size':fs,'text-anchor':'middle','font-weight':'bold'},'時刻'));
  let x=timeW;for(const c of cols){svg.append(svgEl('text',{x:x+c.w/2,y:headH/2+4,'font-size':fs,'text-anchor':'middle','font-weight':'bold'},personLabel(c.p)));x+=c.w;}
  let y=headH;
  for(const row of rows){
    svg.append(svgEl('text',{x:6,y:y+16,'font-size':fs},row.r.time||''));
    let cx=timeW;
    for(const c of cols){let cy=y+cellPad;for(const it of row.cells[c.p.id]){const e=it.e,cw=c.w-2*cellPad;const g=svgEl('g',{transform:`translate(${cx+cellPad},${cy})`});
      g.append(svgEl('rect',{width:cw,height:it.hh,rx:4,fill:e.source==='報告書'?'#fff3cd':'#fff8c5',stroke:e.problemNo?'#d32f2f':'#c9b45c','stroke-width':e.isFinal?3:1,'stroke-dasharray':e.certainty==='推測'?'4 3':e.certainty==='不明'?'1.5 2':null}));
      g.append(svgEl('rect',{width:4,height:it.hh,rx:2,fill:e.problemNo?'#d32f2f':'#c9b45c'}));
      let ty=cardPad;if(it.marks){g.append(svgEl('text',{x:cardPad+2,y:ty+10,'font-size':11,'font-weight':'bold',fill:'#c62828'},it.marks));ty+=15;}
      const t=svgEl('text',{x:cardPad+2,y:ty+fs-1,'font-size':fs,fill:'#111'});it.lines.forEach((ln,i)=>t.append(svgEl('tspan',{x:cardPad+2,dy:i?LH:0},ln||' ')));g.append(t);
      if(it.foot)g.append(svgEl('text',{x:cw-4,y:it.hh-4,'font-size':9,fill:'#6b7280','text-anchor':'end'},it.foot));
      svg.append(g);cy+=it.hh+cardGap;}cx+=c.w;}
    y+=row.h;}
  const xs=[0,timeW];for(const c of cols)xs.push(xs[xs.length-1]+c.w);
  for(const gx of xs)svg.append(svgEl('line',{x1:gx,y1:0,x2:gx,y2:H,stroke:'#999'}));
  let gy=headH;svg.append(svgEl('line',{x1:0,y1:0,x2:W,y2:0,stroke:'#999'}),svgEl('line',{x1:0,y1:gy,x2:W,y2:gy,stroke:'#999'}));
  for(const row of rows){gy+=row.h;svg.append(svgEl('line',{x1:0,y1:gy,x2:W,y2:gy,stroke:'#999'}));}
  svg.dataset.w=W;svg.dataset.h=H;return svg;
}
function svgPane(kind,build){
  const box=h('div',{class:'svgbox'});
  const svg=build();
  if(!svg)return h('div',{class:'empty'},'図がありません');
  const W=+svg.dataset.w,H=+svg.dataset.h;
  const avail=Math.max(260,(window.innerWidth||360)-42);
  if(ui.zoom[kind]==null)ui.zoom[kind]=Math.min(1,avail/W);
  const apply=()=>{const z=ui.zoom[kind];svg.setAttribute('width',Math.round(W*z));svg.setAttribute('height',Math.round(H*z));};
  apply();box.append(svg);
  const zb=(label,fn)=>btn(label,()=>{fn();apply();});
  return h('div',{},
    h('div',{class:'toolrow'},
      zb('－',()=>{ui.zoom[kind]=Math.max(.2,ui.zoom[kind]/1.25);}),

}

function openPicker(){
  const back=h('div',{class:'modal-back',onclick:e=>{if(e.target===back)back.remove();}});
  const box=h('div',{class:'modal'},h('h3',{},'事例を選ぶ'));
  SAMPLES.forEach((s,i)=>box.append(btn(`練習事例 ${i+1}：${s.title}`,()=>{back.remove();load(JSON.parse(JSON.stringify(s.case)),true);},{})));
  const inp=h('input',{type:'file',accept:'.json,application/json',style:'display:none',onchange:async()=>{const f=inp.files[0];if(!f)return;back.remove();try{await loadText(await f.text());}catch(e){alert(e.message);}}});
  box.append(btn('保存したファイルを開く（.json）',()=>inp.click(),{class:'primary'}),inp,btn('閉じる',()=>back.remove(),{}));
  back.append(box);document.body.append(back);
}
async function loadText(text){
  let o;try{o=JSON.parse(text);}catch{throw new Error('ファイルの形式が正しくありません。');}
  if(o.app!=='ImSAFER分析アプリ')throw new Error('このアプリで作成したファイルではありません。');
  if(o.encrypted){
    if(!(window.crypto&&crypto.subtle))throw new Error('この環境ではパスワード付きファイルを開けません。');
    const pw=prompt('パスワードを入力してください');if(pw==null)return;
    const b=s=>{if(!/^[0-9a-f]*$/i.test(s)||s.length%2)throw new Error('このパスワード付きファイルは、通常版（Web版・フル版）で開いてください。');const u=new Uint8Array(s.length/2);for(let i=0;i<u.length;i++)u[i]=parseInt(s.substr(i*2,2),16);return u;};
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(o.salt),iterations:o.iter||200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    let pt;try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(o.iv)},key,b(o.data));}catch{throw new Error('パスワードが違うか、ファイルが壊れています。');}
    o=JSON.parse(new TextDecoder().decode(pt));}
  load(o.case,false);
}
function load(c,isSample){
  c.persons=c.persons||[];c.rows=c.rows||[];c.events=c.events||[];c.factors=c.factors||[];c.measures=c.measures||[];c.quick=c.quick||{pe:[]};
  c.events.forEach(e=>{e.certainty=e.certainty||'事実';e.source=e.source||'会議';});
  c.__sample=!!isSample;S=c;ui.tab='overview';ui.zoom={tl:null,tree:null};render();
}

else{S={caseNo:'',mode:'ImSAFER',persons:[],rows:[],events:[],factors:[],measures:[],quick:{pe:[]}};render();}
